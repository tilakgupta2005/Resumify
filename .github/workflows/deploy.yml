name: Build and Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image via ACR
        run: |
          cd Backend
          az acr build \
            --registry resumifyacr2026 \
            --image resumify-backend:v1 \
            --file Dockerfile \
            .

      - name: Restart App Service to pull new image
        run: |
          az webapp restart --name resumify-backend --resource-group Resumify
